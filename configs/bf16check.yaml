# BF16 reference check (Shubham's priority 3): is the native NVFP4 file really closer to the original weights than
# Q4_K_M / IQ4_NL of the same size? Everything is measured against the BF16 GGUF (NVFP4/MXFP8 experts upcast, i.e. the
# released values) on the same eval set. BF16 does not fit in GPU memory; llama.cpp --fit places layers.
# Our quants are made from BF16 here (the proper source) and also from the NVFP4 file (as in Phase 1), which measures
# the effect of the quantization source.
experiment: bf16check
reference:
  id: ref-bf16
  model: models/Inkling-2-Mini-BF16.gguf
  llama: {ngl: null}
source: models/Inkling-2-Mini-BF16.gguf
imatrix: models/imatrix.gguf
imatrix_default: true
eval:
  dir: data/eval
  ctx: 2048
  domains: {wikitext: 8, code: 4, multilingual: 4}
llama: {ngl: 99}
keep_variants: false
variants:
  - {id: ggml-org-nvfp4, file: models/Inkling-2-Mini-NVFP4.gguf, bench: false}
  - {id: ggml-org-iq4_nl, file: models/Inkling-2-Mini-IQ4_NL.gguf, bench: false}
  - {id: q4_k_m-from-bf16, ftype: Q4_K_M, bench: false}
  - {id: iq4_nl-from-bf16, ftype: IQ4_NL, bench: false}
  - {id: q4_k_m-from-nvfp4, ftype: Q4_K_M, source: models/Inkling-2-Mini-NVFP4.gguf, bench: false}
  - {id: iq4_nl-from-nvfp4, ftype: IQ4_NL, source: models/Inkling-2-Mini-NVFP4.gguf, bench: false}
  - {id: q8_0-from-bf16, ftype: Q8_0, llama: {ngl: null}, bench: false}
